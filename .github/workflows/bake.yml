name: Nightly bake

# Reads Firestore (read-only) and bakes verified overrides + hours + amenities into the
# static *-locations.js files, bumps the PWA cache, and commits. Runs on GitHub's servers —
# no Mac needed. Only VERIFIED data bakes (2-user agreement or admin-set); conflicts/singles wait.
on:
  schedule:
    - cron: '0 8 * * *'      # 08:00 UTC daily (~3-4am US Eastern)
  workflow_dispatch: {}       # also lets you run it by hand from the Actions tab (no terminal)

concurrency:
  group: nightly-bake         # never let two bakes overlap
  cancel-in-progress: false

permissions:
  contents: write             # allow the job to commit & push

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore service account key (from secret)
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json
          # sanity: valid JSON?
          node -e "require('./serviceAccountKey.json')" || { echo "Invalid FIREBASE_SERVICE_ACCOUNT secret"; exit 1; }

      - name: Install firebase-admin
        run: npm install firebase-admin --no-save

      # A failing bake step must stay VISIBLE. These used to end in
      #   || echo "... — continuing"
      # which swallowed the exit code, so the step went green whatever happened and the job
      # always reported success. That is how a fatal SyntaxError in the overrides bake ran
      # unnoticed. `continue-on-error` keeps the original intent — one broken step should not
      # stop the others — while still marking the step failed and flagging the run at the end.
      - name: Bake overrides
        id: bake_overrides
        continue-on-error: true
        run: |
          node fetch-and-bake.js
          if ls baked/*-locations.js >/dev/null 2>&1; then cp baked/*-locations.js .; fi

      - name: Bake hours
        id: bake_hours
        continue-on-error: true
        run: node fetch-and-bake-hours.js

      - name: Bake amenities
        id: bake_amenities
        continue-on-error: true
        run: |
          node export-votes.js
          if [ -f votes-summary.json ]; then
            node bake-confirmed.js votes-summary.json ./*-locations.js
          else
            echo "no votes-summary.json produced — nothing to bake"
          fi

      - name: Commit, bump cache, and push (only if something changed)
        run: |
          git config user.name  "bake-bot"
          git config user.email "bake-bot@users.noreply.github.com"

          git add ./*-locations.js
          if git diff --cached --quiet; then
            echo "Nothing baked tonight — no changes."; exit 0
          fi

          # bump PWA cache so devices load the new data
          CUR=$(grep -oE "bathroomreport-v[0-9]+" sw.js | head -1)
          if [ -n "$CUR" ]; then
            NUM=$(echo "$CUR" | grep -oE "[0-9]+$")
            NEXT="bathroomreport-v$((NUM+1))"
            sed -i "s/$CUR/$NEXT/g" sw.js
            echo "cache: $CUR -> $NEXT"
            git add sw.js
          fi

          # never commit secrets/intermediates
          if git diff --cached --name-only | grep -qiE "serviceAccountKey|overrides\.json|votes-summary\.json|hours-status\.json"; then
            echo "Refusing to commit: a secret/intermediate is staged."; exit 1
          fi

          git commit -m "Nightly bake: overrides + hours + amenities (+cache bump)"
          # push, retrying once if the branch moved under us
          git push || (git pull --rebase --no-edit && git push)

      - name: Clean up key
        if: always()
        run: rm -f serviceAccountKey.json

      # The commit step still runs on a partial bake (baking two of three is better than
      # baking none), so the job would otherwise end green with a step quietly failed.
      # This turns any failed bake step into a red run.
      - name: Fail the run if any bake step failed
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.bake_overrides.outcome }}" = "failure" ] && FAILED="$FAILED overrides"
          [ "${{ steps.bake_hours.outcome }}"     = "failure" ] && FAILED="$FAILED hours"
          [ "${{ steps.bake_amenities.outcome }}" = "failure" ] && FAILED="$FAILED amenities"
          if [ -n "$FAILED" ]; then
            echo "::error::Bake step(s) failed:$FAILED — see the step logs above."
            exit 1
          fi
          echo "All bake steps succeeded."
