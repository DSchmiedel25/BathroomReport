name: Pull analytics

# Nightly at 09:15 UTC (roughly 5am Eastern). GA4 finishes processing the previous
# day within a few hours, and Clarity's export only reaches back three days, so this
# needs to actually run every night — a four-day outage means four Clarity days that
# can never be recovered. The dashboard shows the last-run date so a silent stall is
# visible rather than looking like a quiet week.
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:        # manual run, for setup and for backfilling after a failure

permissions:
  contents: write           # needed to commit analytics-data.json back to the repo

concurrency:
  group: analytics
  cancel-in-progress: false # never cancel a partial run; a killed run loses that Clarity day

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull GA4 + Clarity
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
        run: node scripts/pull-analytics.js

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics-data.json
          # --quiet exits non-zero when there is nothing staged, which is the normal
          # outcome if a run produced identical data. Not an error worth failing on.
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: analytics data $(date -u +%Y-%m-%d)"
            git push
          fi
