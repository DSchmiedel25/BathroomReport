<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Confirm your email · Bathroom Report</title>
<link rel="icon" href="icon-192.png" />
<style>
  :root{ --teal:#2ea1aa; --bg:#0e0f12; --surface:#141619; --line:#252a31;
         --text:#f6f8fa; --muted:#9aa3ad; --green:#00C244; --red:#e53935; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px calc(16px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:28px 22px; text-align:center;
  }
  .mark{ font-size:40px; line-height:1; margin-bottom:14px; }
  h1{ font-size:clamp(19px,5vw,23px); margin:0 0 10px; }
  p{ color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 18px; }
  .ok{ color:var(--green); } .bad{ color:var(--red); }
  .btn{
    display:inline-block; width:100%; min-height:44px; padding:12px 18px;
    background:var(--teal); color:#04211f; font-weight:700; font-size:16px;
    border:0; border-radius:10px; text-decoration:none; cursor:pointer;
  }
  .btn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  /* Status is never colour alone — the icon and the wording each carry it too. */
  @media (prefers-reduced-motion: no-preference){
    .spin{ display:inline-block; animation:spin 1s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" id="mark" aria-hidden="true"><span class="spin">⏳</span></div>
    <h1 id="title">Confirming your email…</h1>
    <p id="msg" role="status" aria-live="polite">One moment.</p>
    <a class="btn" href="/">Back to Bathroom Report</a>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMu-9NYeqvBD4Mbp2jctoAF89raE7p8UM",
  authDomain: "stewarts-map.firebaseapp.com",
  projectId: "stewarts-map",
  storageBucket: "stewarts-map.firebasestorage.app",
  messagingSenderId: "1024042855550",
  appId: "1:1024042855550:web:02120ef818d67c57e17c2f"
};
const app = initializeApp(firebaseConfig);

/* App Check here too. This page is opened from an email, often in a different browser from the
 * one that is signed in, and it calls a Cloud Function — so once enforcement is on it needs its
 * own token like every other entry point. Wrapped: a reCAPTCHA failure must not stop somebody
 * confirming an address they legitimately own. */
try{
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6LdaNnAtAAAAAAuYD76f2g40rfCcQNgYEm49xZQz'),
    isTokenAutoRefreshEnabled: true
  });
}catch(e){ console.warn('App Check did not initialise', e && e.code); }

const $ = (id) => document.getElementById(id);
const show = (icon, title, msg, cls) => {
  $('mark').textContent = icon;
  $('title').textContent = title;
  $('msg').textContent = msg;
  $('msg').className = cls || '';
};

/* No auth required by design: the link may well be opened somewhere that is not signed in.
 * Possession of the single-use token IS the proof, which is why the token is random, hashed at
 * rest, expires in 24 hours, and is cleared the moment it is used. */
const params = new URLSearchParams(location.search);
const uid = params.get('uid') || '';
const token = params.get('t') || '';

if(!uid || !token){
  show('⚠️', 'That link looks incomplete', 'Open the link from your email again, or request a new one from Account settings in the app.', 'bad');
} else {
  try{
    await httpsCallable(getFunctions(app), 'confirmRecoveryEmail')({ uid, token });
    show('✅', 'Email confirmed', 'You can now reset your password from the app if you ever forget it.', 'ok');
  }catch(e){
    const code = (e && e.code) || '';
    show('⚠️', 'That link didn\u2019t work',
      code.includes('permission-denied') || code.includes('not-found')
        ? 'It has expired or already been used. Request a new one from Account settings in the app.'
        : 'Something went wrong. Try the link again, or request a new one from Account settings.',
      'bad');
    console.error('confirmRecoveryEmail failed', code, e);
  }
}
</script>
</body>
</html>
