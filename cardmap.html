<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CardMap — BathroomReport card drops</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  :root{
    --bg:#091322; --bg2:#0d1a2b; --surface:#111f32; --surface2:#16283e; --surface3:#1b3049;
    --text:#f7fbff; --muted:#91a6bb; --accent:#43c6cb; --accent2:#2aa8b0;
    --line:rgba(145,166,187,.16); --danger:#ef5b63; --success:#57c891; --warning:#f3bd63;
    --shadow:0 20px 55px rgba(0,0,0,.28); --radius:16px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, #10233a 0%, var(--bg) 55%) fixed;
    color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font:inherit; cursor:pointer}
  /* 16px is the threshold below which iOS Safari zooms the viewport on focus.
     Setting it here rather than locking maximum-scale keeps pinch-zoom working. */
  input,select,textarea{font:inherit; font-size:16px}
  .hidden{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- Login (mirrors FlushPanel) ---------- */
  .login-wrap{min-height:100vh; display:grid; place-items:center; padding:24px}
  .login-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:30px 26px; box-shadow:var(--shadow)
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:6px; font-weight:900; letter-spacing:-.02em; font-size:20px}
  .brand .dot{width:11px; height:11px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent)}
  .login-card p{color:var(--muted); margin:0 0 22px}
  .field{display:block; margin-bottom:14px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:700}
  .field input{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg2); color:var(--text)
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  .btn{
    border:1px solid var(--line); background:var(--surface2); color:var(--text);
    border-radius:10px; padding:10px 14px; font-weight:800; font-size:13px; min-height:44px
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); color:#04121b; border-color:transparent}
  .btn.primary:hover{background:var(--accent2)}
  .btn.danger{color:var(--danger); border-color:rgba(239,91,99,.4)}
  .btn.danger:hover{border-color:var(--danger)}
  .btn.full{width:100%}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .auth-msg{margin-top:14px; font-size:13px; min-height:18px}
  .auth-msg.error{color:var(--danger)}

  /* ---------- App shell ---------- */
  #appView{position:fixed; inset:0; display:flex; flex-direction:column}

  .topbar{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:calc(10px + var(--safe-top)) 12px 10px;
    background:var(--bg2); border-bottom:1px solid var(--line); z-index:600;
  }
  .topbar .brand{font-size:16px; margin:0; flex:1; min-width:0}
  .topbar .brand span.label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .count-pill{
    flex:none; font-size:11.5px; font-weight:800; color:var(--accent);
    background:rgba(67,198,203,.14); border:0; border-radius:999px; padding:5px 10px;
    min-height:34px;
  }
  .count-pill:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* Stats view, rendered inside the same sheet so there is one bottom-sheet style to maintain. */
  .stat-list{margin:0; padding:0}
  .stat-list div{
    display:flex; align-items:baseline; justify-content:space-between; gap:14px;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .stat-list div:last-child{border-bottom:0}
  .stat-list dt{color:var(--muted); font-size:13px}
  .stat-list dd{margin:0; font-weight:800; font-size:15px; text-align:right}
  .stat-list dd small{display:block; font-weight:600; font-size:11px; color:#6c7f92; margin-top:2px}
  .icon-btn{
    flex:none; width:44px; height:44px; display:grid; place-items:center;
    border:1px solid var(--line); background:var(--surface2); color:var(--text);
    border-radius:10px; font-size:16px;
  }
  .icon-btn:hover{border-color:var(--accent)}
  .icon-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---------- Map ---------- */
  #map{flex:1; min-height:0; background:var(--bg)}
  .leaflet-container{background:var(--bg)}
  /* Leaflet's own controls sit under our floating buttons but above the tiles. */
  .leaflet-top,.leaflet-bottom{z-index:500}

  /* Armed drop mode: crosshair + a persistent banner, so it is never ambiguous
     whether the next tap will create a pin. */
  #map.arming{cursor:crosshair}
  .arm-banner{
    position:absolute; left:50%; transform:translateX(-50%);
    top:calc(12px + var(--safe-top) + 54px);
    background:var(--accent); color:#04121b; font-weight:800; font-size:12.5px;
    padding:9px 14px; border-radius:999px; box-shadow:var(--shadow); z-index:620;
    display:flex; align-items:center; gap:8px; max-width:calc(100vw - 32px);
  }
  .arm-banner button{
    border:0; background:rgba(4,18,27,.16); color:#04121b; font-weight:800;
    border-radius:999px; padding:4px 10px; font-size:12px; min-height:0;
  }

  /* ---------- Floating actions ---------- */
  .fabs{
    position:absolute; right:14px; bottom:calc(18px + var(--safe-bottom));
    display:flex; flex-direction:column; gap:10px; z-index:620;
  }
  .fab{
    width:52px; height:52px; border-radius:16px; display:grid; place-items:center;
    border:1px solid var(--line); background:var(--surface2); color:var(--text);
    box-shadow:var(--shadow); font-size:20px;
  }
  .fab.primary{background:var(--accent); color:#04121b; border-color:transparent}
  .fab.active{background:var(--accent); color:#04121b; border-color:transparent}
  .fab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .fab:disabled{opacity:.55}

  /* ---------- Markers ---------- */
  .drop-pin{
    width:22px; height:22px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg);
    border:2px solid #04121b; box-shadow:0 3px 8px rgba(0,0,0,.45);
  }
  .drop-pin.active{background:var(--accent)}
  .drop-pin.gone{background:#6c7f92}
  /* Age tiers. Opacity alone would be a colour-only signal and hard to read on dark tiles,
     so each tier also changes size, and stale adds a ring — visible at a glance while
     panning. The exact age is always in the marker tooltip and the sheet as words. */
  .drop-pin.age-fresh{opacity:1}
  .drop-pin.age-mid{opacity:.72; width:19px; height:19px}
  .drop-pin.age-stale{
    opacity:.55; width:17px; height:17px;
    box-shadow:0 3px 8px rgba(0,0,0,.45), 0 0 0 3px rgba(243,189,99,.55);
  }
  .drop-pin.pending{background:var(--warning); animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.45}}
  @media (prefers-reduced-motion: reduce){
    .drop-pin.pending{animation:none}
    #toast{transition:none}
  }
  .me-dot{width:16px;height:16px;border-radius:50%;background:#4a9df8;border:2.5px solid #fff;box-shadow:0 0 0 5px rgba(74,157,248,.25)}

  /* ---------- Editor sheet ---------- */
  .sheet-scrim{position:fixed; inset:0; background:rgba(4,10,18,.55); z-index:700}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:710;
    background:var(--surface); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; box-shadow:var(--shadow);
    padding:18px 16px calc(18px + var(--safe-bottom));
    max-height:88vh; overflow-y:auto;
    margin:0 auto; max-width:560px;
  }
  .sheet-grab{width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 14px}
  .sheet h2{margin:0 0 4px; font-size:17px; letter-spacing:-.01em}
  .sheet .sub{color:var(--muted); font-size:12.5px; margin:0 0 16px; word-break:break-word}
  .sheet textarea{
    width:100%; min-height:84px; resize:vertical; padding:11px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg2); color:var(--text); line-height:1.45;
  }
  .sheet textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  .char-count{font-size:11px; color:var(--muted); text-align:right; margin-top:5px}
  .char-count.over{color:var(--danger)}
  .status-row{display:flex; gap:8px; margin-top:4px}
  .status-opt{
    flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg2); color:var(--muted); font-weight:800; font-size:13px;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .status-opt[aria-pressed="true"]{background:var(--surface3); color:var(--text); border-color:var(--accent)}
  .status-opt .swatch{width:10px; height:10px; border-radius:50%; flex:none}
  .status-opt[data-status="active"] .swatch{background:var(--accent)}
  .status-opt[data-status="gone"] .swatch{background:#6c7f92}
  .sheet-acts{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap}
  .sheet-acts .btn{flex:1; min-width:110px}
  .meta-line{font-size:11.5px; color:#6c7f92; margin-top:14px; text-align:center}

  /* ---------- Toast ---------- */
  #toast{position:fixed; bottom:calc(22px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface3); border:1px solid var(--line); color:var(--text); padding:12px 18px;
    border-radius:12px; font-size:13px; font-weight:700; box-shadow:var(--shadow); opacity:0;
    pointer-events:none; transition:.25s; z-index:800; max-width:calc(100vw - 32px); text-align:center}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:rgba(239,91,99,.5)}

  .panel-version{font-size:10.5px; color:#6c7f92; letter-spacing:.02em; text-align:center; margin-top:12px}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="brand"><span class="dot"></span> CardMap</div>
    <p>Card drop tracking for BathroomReport.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn primary full" id="loginBtn">Sign in</button>
    <div class="auth-msg" id="authMsg" role="status"></div>
    <div class="panel-version">CardMap v1.0 · 2026-08-11</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div class="hidden" id="appView">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> <span class="label">CardMap</span></div>
    <button class="count-pill" id="countPill" aria-label="Show card drop stats">0 drops</button>
    <button class="icon-btn" id="toggleGoneBtn" aria-label="Hide picked-up drops" aria-pressed="false" title="Hide picked-up drops">👁</button>
    <button class="icon-btn" id="signoutBtn" aria-label="Sign out" title="Sign out">⎋</button>
  </header>

  <div id="map" role="application" aria-label="Map of card drop locations"></div>

  <div class="arm-banner hidden" id="armBanner" role="status">
    Tap the map to drop a pin
    <button type="button" id="armCancel">Cancel</button>
  </div>

  <div class="fabs">
    <button class="fab" id="locateBtn" aria-label="Drop a pin at my current location" title="Drop a pin here">📍</button>
    <button class="fab primary" id="armBtn" aria-label="Drop a pin by tapping the map" aria-pressed="false" title="Tap-to-drop">✛</button>
  </div>
</div>

<!-- ===================== EDITOR SHEET ===================== -->
<div class="sheet-scrim hidden" id="sheetScrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-grab"></div>
  <h2 id="sheetTitle">New card drop</h2>
  <p class="sub" id="sheetSub"></p>

  <div id="editorBody">
    <label class="field" for="noteInput" style="margin-bottom:6px">
      <span style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700">Note</span>
    </label>
    <textarea id="noteInput" maxlength="200" placeholder="e.g. 5 cards on the counter by the register"></textarea>
    <div class="char-count" id="charCount">0 / 200</div>

    <span style="display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:700">Status</span>
    <div class="status-row" role="group" aria-label="Drop status">
      <button type="button" class="status-opt" data-status="active" aria-pressed="true"><span class="swatch"></span>Still there</button>
      <button type="button" class="status-opt" data-status="gone" aria-pressed="false"><span class="swatch"></span>Gone</button>
    </div>

    <div class="sheet-acts">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn danger hidden" id="deleteBtn">Delete</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>

  <div id="statsBody" class="hidden">
    <dl class="stat-list" id="statList"></dl>
    <div class="sheet-acts">
      <button class="btn primary" id="statsCloseBtn">Close</button>
    </div>
  </div>

  <div class="meta-line" id="metaLine"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, getDoc, deleteField
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeAppCheck, ReCaptchaV3Provider
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";

// Same project as the public app (public client config — safe to ship).
const firebaseConfig = {
  apiKey: "AIzaSyDMu-9NYeqvBD4Mbp2jctoAF89raE7p8UM",
  authDomain: "stewarts-map.firebaseapp.com",
  projectId: "stewarts-map",
  storageBucket: "stewarts-map.firebasestorage.app",
  messagingSenderId: "1024042855550",
  appId: "1:1024042855550:web:02120ef818d67c57e17c2f",
  measurementId: "G-Q63YXL8XVY"
};
const app = initializeApp(firebaseConfig);

/* App Check, matching firebase.js and FlushPanel. This page builds its own Firebase app, so it
 * needs its own registration — without it, enabling enforcement in the console would reject
 * every request from here. Wrapped so a reCAPTCHA failure degrades to unattested requests
 * rather than a blank page. Must precede getFirestore/getAuth. */
try{
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6LdaNnAtAAAAAAuYD76f2g40rfCcQNgYEm49xZQz'),
    isTokenAutoRefreshEnabled: true
  });
}catch(e){
  console.warn('App Check did not initialise; requests will be unattested', e && e.code);
}

const db = getFirestore(app);
const auth = getAuth(app);

// ---------- Helpers ----------
const $ = sel => document.querySelector(sel);
const when = ts => ts ? new Date(ts).toLocaleString() : 'Unknown time';

/* Age of a drop, in whole days. Both stamps are epoch millis, so this is a plain
   subtraction — no timezone handling needed, and DST cannot skew it. */
function ageDays(ts){
  if(typeof ts !== 'number' || !isFinite(ts)) return null;
  return Math.max(0, Math.floor((Date.now() - ts) / 86400000));
}
// FRESH_MAX/MID_MAX are the tier boundaries in days; change here and the pins follow.
const FRESH_MAX = 7, MID_MAX = 28;
function ageTier(ts){
  const d = ageDays(ts);
  if(d === null) return 'age-stale';   // unknown date is treated as needing a look
  if(d < FRESH_MAX) return 'age-fresh';
  if(d < MID_MAX)   return 'age-mid';
  return 'age-stale';
}
function ageLabel(ts){
  const d = ageDays(ts);
  if(d === null) return 'Date unknown';
  if(d === 0) return 'Dropped today';
  if(d === 1) return 'Dropped yesterday';
  if(d < 14)  return 'Dropped ' + d + ' days ago';
  if(d < 60)  return 'Dropped ' + Math.floor(d / 7) + ' weeks ago';
  const m = Math.floor(d / 30);
  return 'Dropped ' + m + (m === 1 ? ' month ago' : ' months ago');
}
/* How long a drop sat before you MARKED it gone.
 *
 * Nothing tells the app when a card was actually taken — the only event it can observe is
 * you flipping the status. markedGoneAt records the moment of that flip, so a later edit to
 * the note cannot inflate the figure the way updatedAt did. The wording says "marked gone"
 * rather than "lasted" because the gap between a card going and you noticing is real and
 * unmeasurable. Drops marked gone before this field existed return null. */
function lifespanDays(d){
  if(!d || d.status !== 'gone') return null;
  if(typeof d.placedAt !== 'number' || typeof d.markedGoneAt !== 'number') return null;
  const days = Math.round((d.markedGoneAt - d.placedAt) / 86400000);
  return days >= 0 ? days : null;
}
function lifespanLabel(d){
  const n = lifespanDays(d);
  if(n === null) return null;
  if(n === 0) return 'Marked gone same day';
  return 'Marked gone after ' + n + (n === 1 ? ' day' : ' days');
}

// Median rather than mean: one pin left sitting for a year would drag an average badly.
function medianLifespan(){
  const vals = [];
  drops.forEach(d => { const n = lifespanDays(d.data); if(n !== null) vals.push(n); });
  if(!vals.length) return null;
  vals.sort((a, b) => a - b);
  const mid = Math.floor(vals.length / 2);
  const med = vals.length % 2 ? vals[mid] : Math.round((vals[mid - 1] + vals[mid]) / 2);
  return { median: med, n: vals.length };
}

/* Great-circle distance in miles. Haversine rather than a flat approximation — the error
 * of the flat version grows with latitude, and this costs nothing at these volumes. */
function distanceMiles(lat1, lng1, lat2, lng2){
  const R = 3958.8, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat / 2) ** 2
          + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
function fmtDist(mi){
  if(mi === null || !isFinite(mi)) return null;
  if(mi < 0.19) return Math.round(mi * 5280) + ' ft away';
  if(mi < 10)   return mi.toFixed(1) + ' mi away';
  return Math.round(mi) + ' mi away';
}
// Last known position, set by the 📍 button or a passive lookup. Null until we have one.
let lastPos = null;
function distanceFrom(d){
  if(!lastPos || typeof d.lat !== 'number' || typeof d.lng !== 'number') return null;
  return distanceMiles(lastPos.lat, lastPos.lng, d.lat, d.lng);
}

/* Ask for position only if permission was ALREADY granted, so opening the page never
 * raises a prompt on its own. Permissions API is missing on some browsers; that path
 * simply leaves distances hidden until the 📍 button is used. */
async function passiveLocate(){
  try{
    if(!navigator.geolocation || !navigator.permissions) return;
    const st = await navigator.permissions.query({ name:'geolocation' });
    if(st.state !== 'granted') return;
    navigator.geolocation.getCurrentPosition(
      p => { lastPos = { lat:p.coords.latitude, lng:p.coords.longitude }; },
      () => {},
      { enableHighAccuracy:false, timeout:8000, maximumAge:120000 }
    );
  }catch(e){ /* no permissions API, or it threw — distances stay hidden */ }
}

// Tooltip / accessible name for a marker.
function markerTitle(data){
  const bits = [data.note || 'Card drop', ageLabel(data.placedAt)];
  if(data.status === 'gone') bits.push('picked up');
  return bits.join(' — ');
}
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, 2600);
}

const NOTE_MAX = 200;
const STATUSES = ['active','gone'];

let currentUser = null;
let map = null;
let meMarker = null;
/* id -> { data, marker }. The single source of truth for what is on the map; every render
 * path reads from here so the pin, the count and the sheet can never disagree. */
const drops = new Map();
let pendingMarker = null;   // the unsaved pin for a brand-new drop
let editingId = null;       // null while creating, a doc id while editing
let sheetStatus = 'active';
let hideGone = false;
let arming = false;

// ================= AUTH =================
$('#loginBtn').addEventListener('click', doLogin);
$('#password').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
$('#email').addEventListener('keydown', e => { if(e.key === 'Enter') $('#password').focus(); });

async function doLogin(){
  const email = $('#email').value.trim();
  const password = $('#password').value;
  const msg = $('#authMsg');
  msg.className = 'auth-msg'; msg.textContent = '';
  if(!email || !password){ msg.className = 'auth-msg error'; msg.textContent = 'Enter your email and password.'; return; }
  $('#loginBtn').disabled = true; $('#loginBtn').textContent = 'Signing in…';
  try{
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged handles the rest.
  }catch(e){
    msg.className = 'auth-msg error';
    msg.textContent = (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
      ? 'Wrong email or password.' : 'Sign-in failed — try again.';
    $('#loginBtn').disabled = false; $('#loginBtn').textContent = 'Sign in';
  }
}

$('#signoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if(!user){ showLogin(); return; }
  // Verify admin before showing anything. Same check FlushPanel makes.
  try{
    const snap = await getDoc(doc(db, 'admins', user.uid));
    if(!snap.exists() || snap.data().enabled !== true){
      await signOut(auth);
      const msg = $('#authMsg'); msg.className = 'auth-msg error';
      msg.textContent = 'That account isn\u2019t an admin.';
      showLogin(); return;
    }
  }catch(e){
    await signOut(auth);
    const msg = $('#authMsg'); msg.className = 'auth-msg error';
    msg.textContent = 'Could not verify admin access.';
    showLogin(); return;
  }
  currentUser = user;
  showApp();
  initMap();
  loadDrops();
  passiveLocate();   // no-op unless location permission was already granted
});

function showLogin(){
  currentUser = null;
  $('#appView').classList.add('hidden');
  $('#loginView').classList.remove('hidden');
  $('#loginBtn').disabled = false; $('#loginBtn').textContent = 'Sign in';
  $('#password').value = '';
  closeSheet();
}
function showApp(){
  $('#loginView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  const msg = $('#authMsg'); msg.className = 'auth-msg'; msg.textContent = '';
}

// ================= MAP =================
function initMap(){
  if(map) { map.invalidateSize(); return; }
  map = L.map('map', { zoomControl:true, attributionControl:true })
         .setView([42.6526, -73.7562], 9);   // Albany — replaced by fitBounds once drops load
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  map.on('click', e => {
    if(!arming) return;   // plain taps must never create pins
    setArming(false);
    startNewDrop(e.latlng.lat, e.latlng.lng);
  });

  // The map lives in a flex column, so it needs a nudge after orientation changes.
  window.addEventListener('resize', () => map && map.invalidateSize());
  window.addEventListener('orientationchange', () => setTimeout(() => map && map.invalidateSize(), 250));
}

/* Pass 'pending' for the unsaved pin, or a drop record for a saved one. A saved drop gets
   both a status class (colour) and an age class (opacity/size/ring). A picked-up drop still
   gets its age tier — knowing a card sat there two months before vanishing is worth seeing. */
function pinIcon(arg){
  let cls;
  if(arg === 'pending'){
    cls = 'pending';
  }else{
    cls = (arg.status === 'gone' ? 'gone' : 'active') + ' ' + ageTier(arg.placedAt);
  }
  return L.divIcon({
    className: '',
    html: '<div class="drop-pin ' + cls + '"></div>',
    iconSize: [22, 22],
    iconAnchor: [11, 20]
  });
}

function setArming(on){
  arming = on;
  $('#armBtn').classList.toggle('active', on);
  $('#armBtn').setAttribute('aria-pressed', String(on));
  $('#armBanner').classList.toggle('hidden', !on);
  document.getElementById('map').classList.toggle('arming', on);
}

$('#armBtn').addEventListener('click', () => setArming(!arming));
$('#armCancel').addEventListener('click', () => setArming(false));

// ================= LOAD =================
async function loadDrops(){
  try{
    const snap = await getDocs(collection(db, 'cardDrops'));
    drops.forEach(d => map.removeLayer(d.marker));
    drops.clear();
    snap.forEach(d => addDropToMap(d.id, d.data()));
    renderCount();
    fitToDrops();
  }catch(e){
    console.error('cardDrops load failed', e);
    toast('Load failed: ' + (e && e.code ? e.code : 'unknown'), true);
  }
}

function addDropToMap(id, data){
  const marker = L.marker([data.lat, data.lng], {
    icon: pinIcon(data),
    draggable: true,
    title: markerTitle(data)
  });
  marker.on('click', () => openEditor(id));
  marker.on('dragend', async () => {
    const p = marker.getLatLng();
    try{
      await updateDoc(doc(db, 'cardDrops', id), {
        lat: p.lat, lng: p.lng, updatedAt: Date.now()
      });
      const rec = drops.get(id);
      if(rec){ rec.data.lat = p.lat; rec.data.lng = p.lng; }
      toast('Pin moved.');
    }catch(err){
      console.error('move failed', err && err.code);
      // Snap back so the map never shows a position the database does not hold.
      const rec = drops.get(id);
      if(rec) marker.setLatLng([rec.data.lat, rec.data.lng]);
      toast('Could not move pin.', true);
    }
  });
  drops.set(id, { data, marker });
  if(!(hideGone && data.status === 'gone')) marker.addTo(map);
}

function renderCount(){
  let active = 0, gone = 0, stale = 0;
  drops.forEach(d => {
    if(d.data.status === 'gone'){ gone++; return; }
    active++;
    // Only drops still out can be "stale" — a picked-up one needs nothing.
    if(ageTier(d.data.placedAt) === 'age-stale') stale++;
  });
  const parts = [active + ' out'];
  if(!hideGone) parts.push(gone + ' gone');
  if(stale) parts.push(stale + ' stale');
  $('#countPill').textContent = parts.join(' · ');
}

function fitToDrops(){
  const pts = [];
  drops.forEach(d => { if(!(hideGone && d.data.status === 'gone')) pts.push([d.data.lat, d.data.lng]); });
  if(pts.length === 1) map.setView(pts[0], 14);
  else if(pts.length > 1) map.fitBounds(L.latLngBounds(pts), { padding:[50,50], maxZoom:15 });
}

$('#toggleGoneBtn').addEventListener('click', () => {
  hideGone = !hideGone;
  const btn = $('#toggleGoneBtn');
  btn.setAttribute('aria-pressed', String(hideGone));
  btn.setAttribute('aria-label', hideGone ? 'Show picked-up drops' : 'Hide picked-up drops');
  btn.title = hideGone ? 'Show picked-up drops' : 'Hide picked-up drops';
  btn.textContent = hideGone ? '🚫' : '👁';
  drops.forEach(d => {
    const shouldShow = !(hideGone && d.data.status === 'gone');
    if(shouldShow && !map.hasLayer(d.marker)) d.marker.addTo(map);
    if(!shouldShow && map.hasLayer(d.marker)) map.removeLayer(d.marker);
  });
  renderCount();
});

// ================= GEOLOCATION =================
$('#locateBtn').addEventListener('click', () => {
  if(!navigator.geolocation){ toast('This device has no location support.', true); return; }
  setArming(false);
  const btn = $('#locateBtn');
  btn.disabled = true; btn.textContent = '…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.disabled = false; btn.textContent = '📍';
      const { latitude, longitude } = pos.coords;
      lastPos = { lat: latitude, lng: longitude };
      if(meMarker) map.removeLayer(meMarker);
      meMarker = L.marker([latitude, longitude], {
        icon: L.divIcon({ className:'', html:'<div class="me-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] }),
        interactive: false
      }).addTo(map);
      map.setView([latitude, longitude], 17);
      startNewDrop(latitude, longitude);
    },
    err => {
      btn.disabled = false; btn.textContent = '📍';
      // Every documented failure mode gets its own wording — "location failed" tells you nothing.
      if(err.code === err.PERMISSION_DENIED)          toast('Location permission denied. Enable it in your browser settings, or use tap-to-drop.', true);
      else if(err.code === err.POSITION_UNAVAILABLE)  toast('Location unavailable right now. Try tap-to-drop.', true);
      else if(err.code === err.TIMEOUT)               toast('Location timed out. Try again or use tap-to-drop.', true);
      else                                            toast('Could not get your location.', true);
    },
    { enableHighAccuracy:true, timeout:12000, maximumAge:15000 }
  );
});

// ================= EDITOR =================
function startNewDrop(lat, lng){
  editingId = null;
  clearPending();
  pendingMarker = L.marker([lat, lng], { icon: pinIcon('pending'), draggable: true }).addTo(map);
  map.panTo([lat, lng]);
  openSheet({
    title: 'New card drop',
    sub: lat.toFixed(6) + ', ' + lng.toFixed(6),
    note: '',
    status: 'active',
    meta: '',
    canDelete: false
  });
}

function openEditor(id){
  const rec = drops.get(id);
  if(!rec) return;
  setArming(false);
  clearPending();
  editingId = id;
  const d = rec.data;
  const parts = [when(d.placedAt)];
  if(d.createdByName) parts.push('· ' + d.createdByName);
  if(d.updatedAt) parts.push('· edited ' + when(d.updatedAt));

  // Sub-line: coordinates, plus whatever we can derive right now.
  const sub = [Number(d.lat).toFixed(6) + ', ' + Number(d.lng).toFixed(6)];
  const dist = fmtDist(distanceFrom(d));
  if(dist) sub.push(dist);
  const life = lifespanLabel(d);
  if(life) sub.push(life);

  openSheet({
    title: ageLabel(d.placedAt),
    sub: sub.join(' · '),
    note: d.note || '',
    status: STATUSES.includes(d.status) ? d.status : 'active',
    meta: parts.join(' '),
    canDelete: true
  });
}

function openSheet({ title, sub, note, status, meta, canDelete }){
  // Always restore editor mode — the stats view shares this sheet.
  $('#editorBody').classList.remove('hidden');
  $('#statsBody').classList.add('hidden');
  $('#sheetTitle').textContent = title;
  $('#sheetSub').textContent = sub;
  $('#noteInput').value = note;
  $('#metaLine').textContent = meta;
  $('#deleteBtn').classList.toggle('hidden', !canDelete);
  setSheetStatus(status);
  updateCharCount();
  $('#sheetScrim').classList.remove('hidden');
  $('#sheet').classList.remove('hidden');
  $('#noteInput').focus();
}

/* Stats view. Reuses the sheet so there is one bottom-sheet style, one scrim and one
   Escape handler rather than a second near-identical component. */
function openStats(){
  setArming(false);
  clearPending();
  editingId = null;

  let out = 0, gone = 0, stale = 0, oldestOut = null;
  drops.forEach(({ data }) => {
    if(data.status === 'gone'){ gone++; return; }
    out++;
    if(ageTier(data.placedAt) === 'age-stale') stale++;
    if(typeof data.placedAt === 'number' && (oldestOut === null || data.placedAt < oldestOut)){
      oldestOut = data.placedAt;
    }
  });

  const rows = [
    ['Cards still out', String(out), null],
    ['Marked gone', String(gone), null],
    ['Stale (28+ days)', String(stale), stale ? 'worth a restock run' : null],
    ['Oldest still out', oldestOut === null ? '—' : ageLabel(oldestOut).replace('Dropped ', ''), null]
  ];

  const med = medianLifespan();
  rows.push(med
    ? ['Typical time to gone',
       med.median + (med.median === 1 ? ' day' : ' days'),
       'median of ' + med.n + (med.n === 1 ? ' drop' : ' drops') + ' · measures when you marked it, not when it went']
    : ['Typical time to gone', '—', 'no drops marked gone yet']);

  const dl = $('#statList');
  dl.textContent = '';
  for(const [label, value, sub] of rows){
    const wrap = document.createElement('div');
    const dt = document.createElement('dt'); dt.textContent = label;
    const dd = document.createElement('dd'); dd.textContent = value;
    if(sub){ const s = document.createElement('small'); s.textContent = sub; dd.appendChild(s); }
    wrap.append(dt, dd);
    dl.appendChild(wrap);
  }

  $('#sheetTitle').textContent = 'Card stats';
  $('#sheetSub').textContent = drops.size + (drops.size === 1 ? ' drop tracked' : ' drops tracked');
  $('#metaLine').textContent = '';
  $('#editorBody').classList.add('hidden');
  $('#statsBody').classList.remove('hidden');
  $('#sheetScrim').classList.remove('hidden');
  $('#sheet').classList.remove('hidden');
  $('#statsCloseBtn').focus();
}
$('#countPill').addEventListener('click', openStats);
$('#statsCloseBtn').addEventListener('click', closeSheet);

function closeSheet(){
  $('#sheetScrim').classList.add('hidden');
  $('#sheet').classList.add('hidden');
  editingId = null;
  clearPending();
}

function clearPending(){
  if(pendingMarker){ map.removeLayer(pendingMarker); pendingMarker = null; }
}

function setSheetStatus(s){
  sheetStatus = STATUSES.includes(s) ? s : 'active';
  document.querySelectorAll('.status-opt').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.status === sheetStatus));
  });
}
document.querySelectorAll('.status-opt').forEach(b => {
  b.addEventListener('click', () => setSheetStatus(b.dataset.status));
});

function updateCharCount(){
  const n = $('#noteInput').value.length;
  const el = $('#charCount');
  el.textContent = n + ' / ' + NOTE_MAX;
  el.classList.toggle('over', n > NOTE_MAX);
}
$('#noteInput').addEventListener('input', updateCharCount);

$('#cancelBtn').addEventListener('click', closeSheet);
$('#sheetScrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(!$('#sheet').classList.contains('hidden')) closeSheet();
    else if(arming) setArming(false);
  }
});

// ---------- Save ----------
$('#saveBtn').addEventListener('click', async () => {
  const note = $('#noteInput').value.trim();
  if(note.length > NOTE_MAX){ toast('Note is too long.', true); return; }
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    if(editingId){
      const rec = drops.get(editingId);
      const prevStatus = rec ? rec.data.status : null;
      const now = Date.now();
      const patch = { note, status: sheetStatus, updatedAt: now };

      /* markedGoneAt is stamped only on the transition INTO gone, and removed on the way
         back out. Re-saving a pin that was already gone leaves the original stamp alone,
         which is the whole point — editing a note must not reset the clock. */
      let newMarkedGoneAt;
      if(sheetStatus === 'gone' && prevStatus !== 'gone'){
        patch.markedGoneAt = now;
        newMarkedGoneAt = now;
      }else if(sheetStatus !== 'gone' && prevStatus === 'gone'){
        // deleteField, not null — the rules require a number or nothing at all.
        patch.markedGoneAt = deleteField();
        newMarkedGoneAt = undefined;
      }

      await updateDoc(doc(db, 'cardDrops', editingId), patch);
      if(rec){
        rec.data.note = note;
        rec.data.status = sheetStatus;
        rec.data.updatedAt = now;
        if(newMarkedGoneAt !== undefined) rec.data.markedGoneAt = newMarkedGoneAt;
        else if('markedGoneAt' in patch) delete rec.data.markedGoneAt;
        rec.marker.setIcon(pinIcon(rec.data));
        rec.marker.options.title = markerTitle(rec.data);
        const shouldShow = !(hideGone && sheetStatus === 'gone');
        if(shouldShow && !map.hasLayer(rec.marker)) rec.marker.addTo(map);
        if(!shouldShow && map.hasLayer(rec.marker)) map.removeLayer(rec.marker);
      }
      toast('Drop updated.');
    }else{
      if(!pendingMarker){ toast('No pin to save.', true); btn.disabled = false; btn.textContent = 'Save'; return; }
      const p = pendingMarker.getLatLng();
      const now = Date.now();
      const payload = {
        lat: p.lat,
        lng: p.lng,
        note,
        status: sheetStatus,
        placedAt: now,
        createdBy: currentUser.uid,
        // Bounded to 40 to match the rule; a long address would otherwise be rejected outright.
        createdByName: String(currentUser.email || '').slice(0, 40)
      };
      // A pin created already marked gone gets its stamp immediately, so the lifespan is 0
      // rather than permanently unknown.
      if(sheetStatus === 'gone') payload.markedGoneAt = now;
      const ref = await addDoc(collection(db, 'cardDrops'), payload);
      addDropToMap(ref.id, payload);
      toast('Card drop saved.');
    }
    renderCount();
    closeSheet();
  }catch(e){
    console.error('save failed', e);
    // Admin-only page, so showing the raw code is safe and saves a console round-trip.
    toast('Save failed: ' + (e && e.code ? e.code : e && e.message ? e.message : 'unknown'), true);
  }finally{
    btn.disabled = false; btn.textContent = 'Save';
  }
});

// ---------- Delete ----------
$('#deleteBtn').addEventListener('click', async () => {
  if(!editingId) return;
  if(!confirm('Delete this card drop? This cannot be undone.')) return;
  const id = editingId;
  const btn = $('#deleteBtn');
  btn.disabled = true; btn.textContent = 'Deleting…';
  try{
    await deleteDoc(doc(db, 'cardDrops', id));
    const rec = drops.get(id);
    if(rec){ map.removeLayer(rec.marker); drops.delete(id); }
    renderCount();
    closeSheet();
    toast('Card drop deleted.');
  }catch(e){
    console.error('delete failed', e && e.code);
    toast('Could not delete.', true);
  }finally{
    btn.disabled = false; btn.textContent = 'Delete';
  }
});
</script>
</body>
